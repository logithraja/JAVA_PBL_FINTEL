spring.application.name=expense-tracker-springboot-server-test
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true

jwt.secret=fintelSuperSecretKeyThatIsAtLeast32BytesLongForSecurity!
jwt.expiration-ms=86400000

logging.level.com.example.expense_tracker=WARN
logging.level.org.springframework.security=WARN
