spring.application.name=expense-tracker-springboot-server
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT Configuration (15 min access token, 7 days refresh token)
jwt.secret=${JWT_SECRET:fintelSuperSecretKeyThatIsAtLeast32BytesLongForSecurity!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Rate Limiting Configuration
fintel.rate-limit.auth-limit=${FINTEL_RATE_LIMIT_AUTH:5}
fintel.rate-limit.ai-limit=${FINTEL_RATE_LIMIT_AI:20}

# CORS Configuration
fintel.cors.allowed-origins=${FINTEL_CORS_ALLOWED_ORIGINS:}

# SpringDoc OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
