spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fintel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fintel_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fintel_secret_pass}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.com.example.expense_tracker=INFO
logging.level.org.springframework.security=WARN

# Strict CORS: empty by default in production, configurable via env
fintel.cors.allowed-origins=${FINTEL_CORS_ALLOWED_ORIGINS:}
