spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fintel_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.com.example.expense_tracker=INFO
logging.level.org.springframework.security=WARN

# Strict CORS: empty by default in production
fintel.cors.allowed-origins=${FINTEL_CORS_ALLOWED_ORIGINS:}
