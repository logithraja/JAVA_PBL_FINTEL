services:
  fintel-mysql:
    image: mysql:8.0
    container_name: fintel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_fintel_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fintel_db}
      MYSQL_USER: ${MYSQL_USER:-fintel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fintel_secret_pass}
    ports:
      - "3306:3306"
    volumes:
      - fintel_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fintel-net

  fintel-server:
    build:
      context: ./fintel-springboot-server
      dockerfile: Dockerfile
    container_name: fintel-server
    restart: unless-stopped
    depends_on:
      fintel-mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://fintel-mysql:3306/${MYSQL_DATABASE:-fintel_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-fintel_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-fintel_secret_pass}
      JWT_SECRET: ${JWT_SECRET:-fintelSuperSecretKeyThatIsAtLeast32BytesLongForSecurity!}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FINTEL_CORS_ALLOWED_ORIGINS: ${FINTEL_CORS_ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - fintel-net

volumes:
  fintel_db_data:
    driver: local

networks:
  fintel-net:
    driver: bridge
