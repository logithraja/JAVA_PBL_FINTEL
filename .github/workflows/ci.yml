name: Fintel CI

on:
  push:
    branches: [ main, master, production-hardening ]
  pull_request:
    branches: [ main, master, production-hardening ]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java: [ '17', '21' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Test Spring Boot Server
        run: mvn clean test -f fintel-springboot-server/pom.xml

      - name: Package Spring Boot Server (JAR)
        run: mvn clean package -DskipTests -f fintel-springboot-server/pom.xml

      - name: Test JavaFX Client
        run: mvn clean test -f fintel-client/pom.xml

      - name: Package JavaFX Client (Fat JAR)
        run: mvn clean package -DskipTests -f fintel-client/pom.xml
